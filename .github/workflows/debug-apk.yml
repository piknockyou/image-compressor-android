name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  debug-apk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Robolectric downloads its Android runtime from Maven during tests; a single
      # failed download has failed builds with identical code, so retry before giving up
      - name: Run unit tests
        run: |
          for attempt in 1 2 3; do
            if ./gradlew testDebugUnitTest; then
              exit 0
            fi
            echo "Unit tests failed (attempt $attempt of 3), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ic-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
